apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nx-module-federation
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  rules:
    - host: nx-module-federation.local
      http:
        paths:
          - path: /(.*)
            pathType: Prefix
            backend:
              service:
                name: store
                port:
                  number: 80
          - path: /products(.*)
            pathType: Prefix
            backend:
              service:
                name: products
                port:
                  number: 80
          - path: /checkout(.*)
            pathType: Prefix
            backend:
              service:
                name: checkout
                port:
                  number: 80
